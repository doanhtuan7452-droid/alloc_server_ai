name: Build Docker Image and Deploy to Azure Web App (GHCR)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Cấp quyền cho GitHub Actions ghi Image vào GitHub Packages (GHCR)
    permissions:
      contents: read
      packages: write

    steps:
      # Bước 1: Lấy mã nguồn mới nhất
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true # QUAN TRỌNG: Tải đầy đủ các file model .pkl từ Git LFS

      # Bước 2: Đăng nhập vào GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bước 3: Build Docker Image và Push lên GHCR
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/alloc-server-ai:latest
            ghcr.io/${{ github.repository_owner }}/alloc-server-ai:${{ github.sha }}

      # Bước 4: Deploy Docker Image từ GHCR lên Azure Web App for Containers
      - name: Deploy Container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-alloc-server-ai'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'ghcr.io/${{ github.repository_owner }}/alloc-server-ai:latest'